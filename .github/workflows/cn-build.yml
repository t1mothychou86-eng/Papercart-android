# CN: Papercart debug validation; signed tag releases use cn-release.yml.
name: Papercart Android debug

on:
  push:
    branches: [cn]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cn-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Install native build tool
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: flutter pub get
      - name: Test Papercart branding and translation fixes
        run: flutter test test/cn/ test/services/translations/
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: papercart-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
